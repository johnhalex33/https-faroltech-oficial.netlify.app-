<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarolTech | Painel</title><script src="../config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.logo{width:180px;max-height:65px;object-fit:contain}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#11161b;border:1px solid #303840;border-radius:16px;padding:16px;margin-top:12px}.yellow{color:#ffd000}.muted{color:#aeb4bb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.input,.select{width:100%;padding:13px;border-radius:10px;border:1px solid #39424a;background:#0d1115;color:#fff}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:#ffd000;color:#000}.secondary{background:#242b31;color:#fff}.danger{background:#6d2020;color:#fff}.appt{border-left:4px solid #ffd000}.badge{display:inline-block;border-radius:99px;padding:5px 8px;background:#252d34;color:#ddd;font-size:11px}.new{box-shadow:0 0 0 2px #ffd000 inset}.wa{background:#173a25;color:#78ef9f}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><main class="wrap"><div class="top"><img class="logo" src="../assets/faroltech-logo.png"><div id="status" class="muted">Painel</div></div><section id="login" class="card"><h2>Área administrativa</h2><p class="muted">Digite a senha para acessar os agendamentos.</p><input id="pass" class="input" type="password" placeholder="Senha"><button class="btn primary" style="margin-top:10px" onclick="login()">Entrar</button></section><section id="panel" class="hidden"><div class="card"><div class="row"><div><h2 style="margin:0">Agenda FarolTech</h2><div class="muted">Novos agendamentos aparecem automaticamente.</div></div><button class="btn secondary" onclick="logout()">Sair</button></div></div><div class="grid"><div class="card"><b id="count">0</b><div class="muted">Agendamentos ativos</div></div><div class="card"><b id="pending">0</b><div class="muted">Pendentes</div></div><div class="card"><b id="dateLabel">Hoje</b><div class="muted">Data</div></div></div><div class="card"><div class="row"><h3 style="margin:0">Agenda do dia</h3><input id="date" class="input" type="date" style="max-width:180px" onchange="load()"></div><div id="list"></div></div></section></main><script>
let token=sessionStorage.getItem('ft_admin_token'),lastIds=new Set();function api(path,opt={}){return fetch(window.FAROLTECH_API_BASE+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}}).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d})}
function login(){fetch(window.FAROLTECH_API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})}).then(async r=>{let d=await r.json();if(!r.ok)throw new Error(d.error||'Senha inválida');token=d.token;sessionStorage.setItem('ft_admin_token',token);openPanel()}).catch(e=>alert(e.message))}
function openPanel(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');let d=new Date();document.getElementById('date').value=d.toISOString().slice(0,10);load();setInterval(load,20000)}
function logout(){sessionStorage.removeItem('ft_admin_token');location.reload()}
async function load(){if(!token)return;let date=document.getElementById('date').value;try{let arr=await api('/api/admin/appointments?from='+date+'&to='+date);arr=arr.filter(a=>a.status!=='cancelled');document.getElementById('count').textContent=arr.length;document.getElementById('pending').textContent=arr.filter(a=>a.status==='pending').length;document.getElementById('dateLabel').textContent=date.split('-').reverse().join('/');document.getElementById('status').textContent='● Atualizado '+new Date().toLocaleTimeString('pt-BR');if(arr.some(a=>!lastIds.has(a.id))&&lastIds.size)notify();lastIds=new Set(arr.map(a=>a.id));document.getElementById('list').innerHTML=arr.length?arr.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>card(a)).join(''):'<p class="muted">Nenhum agendamento neste dia.</p>'}catch(e){if(e.message.toLowerCase().includes('token'))logout();else document.getElementById('status').textContent='Erro de conexão'}}
function card(a){let phone=(a.phone||'').replace(/\D/g,'');return `<div class="card appt"><div class="row"><div><b>${a.time}</b> — ${a.customer_name||''}</div><span class="badge ${a.status==='pending'?'new':''}">${a.status}</span></div><p><b>Serviço:</b> ${a.service_name||a.service||''}<br><b>WhatsApp:</b> ${a.phone||''}<br><b>Veículo:</b> ${a.vehicle||'Não informado'}<br><b>Observação:</b> ${a.notes||'—'}</p><div class="row"><a class="btn wa" href="https://wa.me/${phone}" target="_blank">WhatsApp</a><button class="btn danger" onclick="cancelAppt(${a.id})">Cancelar</button></div></div>`}
async function cancelAppt(id){if(!confirm('Cancelar este agendamento?'))return;try{await api('/api/admin/appointments/'+id+'/cancel',{method:'POST'});load()}catch(e){alert(e.message)}}
function notify(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();if('Notification'in window&&Notification.permission==='granted')new Notification('FarolTech',{body:'Novo agendamento recebido!'})}
if(token)openPanel();
</script></body></html>
