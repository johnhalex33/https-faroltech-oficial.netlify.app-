<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarolTech | Agendamento</title><script src="../config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7f7f7;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 16px 40px}.logo{width:190px;max-height:65px;object-fit:contain;object-position:left}.hero,.card{background:linear-gradient(145deg,#171b20,#0b0d0f);border:1px solid #303840;border-radius:20px;padding:18px;margin-top:14px}.hero h1{font-size:28px;margin:8px 0}.yellow{color:#ffd000}.muted{color:#aeb4bb}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:15px 0}.step{text-align:center;font-size:10px;color:#69727a}.step b{display:block;width:27px;height:27px;line-height:27px;border-radius:50%;background:#242a30;margin:auto auto 4px}.step.on{color:#ffd000}.step.on b{background:#ffd000;color:#000}h2{margin:5px 0 12px}.services{display:grid;gap:10px}.service{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #343c44;background:#11161b;padding:14px;border-radius:14px;cursor:pointer}.service.sel{border-color:#ffd000;box-shadow:0 0 0 1px #ffd000 inset}.price{color:#ffd000;font-weight:900;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}.primary{background:#ffd000;color:#050505}.secondary{background:#20272d;color:#fff}.day,.slot{padding:13px 6px;border-radius:11px;border:1px solid #39424a;background:#11161b;color:#fff;cursor:pointer}.day.sel,.slot.sel{background:#ffd000;color:#000;border-color:#ffd000}.slot.off{opacity:.3;text-decoration:line-through;cursor:not-allowed}.form{display:grid;gap:10px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #39424a;background:#0e1216;color:#fff}.summary{line-height:1.8}.ok{border-color:#1e9c54;background:#0b2115}.notice{padding:12px;border-radius:12px;background:#241f00;border:1px solid #665600;color:#ffe875}.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center}.link{background:none;border:0;color:#ffd000;cursor:pointer;font-weight:bold}
</style></head><body><main class="wrap"><div class="top"><img class="logo" src="../assets/faroltech-logo.png"><button class="link" onclick="showMine()">Meus agendamentos</button></div><div class="hero"><div class="yellow"><b>FAROLTECH</b> • ESTÉTICA AUTOMOTIVA</div><h1>Agende o polimento do seu farol</h1><div class="muted">Escolha o serviço, a data e o melhor horário.</div></div><div class="steps"><div class="step on" id="s1"><b>1</b>Serviço</div><div class="step" id="s2"><b>2</b>Data</div><div class="step" id="s3"><b>3</b>Horário</div><div class="step" id="s4"><b>4</b>Dados</div></div><section id="app"></section></main><script>
const $=id=>document.getElementById(id);let services=[],selectedService=null,selectedDate='',selectedTime='';
async function api(path,opt={}){let r=await fetch(window.FAROLTECH_API_BASE+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível conectar ao servidor.');return d}
function steps(n){for(let i=1;i<=4;i++)$('s'+i).classList.toggle('on',i<=n)}
async function start(){try{services=await api('/api/services');render1()}catch(e){$('app').innerHTML='<div class="card notice">Não foi possível conectar ao sistema de agendamento. Verifique a configuração do servidor.</div>'}}
function render1(){steps(1);$('app').innerHTML='<div class="card"><h2>Escolha o serviço</h2><div class="services">'+services.map(s=>`<div class="service ${selectedService?.id===s.id?'sel':''}" onclick="pickService(${s.id})"><div><b>${s.name}</b><div class="muted" style="font-size:12px;margin-top:4px">Polimento profissional FarolTech</div></div><div class="price">R$ ${Number(s.price).toFixed(2).replace('.',',')}</div></div>`).join('')+'</div><button class="btn primary" onclick="nextDate()" '+(!selectedService?'disabled':'')+'>Continuar</button></div>'}
function pickService(id){selectedService=services.find(x=>x.id===id);render1()}
function dates(){let a=[];for(let i=0;i<14;i++){let d=new Date();d.setHours(12);d.setDate(d.getDate()+i);let iso=d.toISOString().slice(0,10);a.push({iso,label:d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})})}return a}
function nextDate(){if(!selectedService)return;steps(2);$('app').innerHTML='<div class="card"><h2>Escolha a data</h2><div class="grid">'+dates().map(d=>`<button class="day ${selectedDate===d.iso?'sel':''}" onclick="pickDate('${d.iso}')">${d.label}</button>`).join('')+'</div><button class="btn secondary" onclick="render1()">Voltar</button></div>'}
async function pickDate(d){selectedDate=d;steps(3);$('app').innerHTML='<div class="card"><h2>Escolha o horário</h2><div id="times" class="grid">Carregando...</div><button class="btn secondary" onclick="nextDate()">Voltar</button></div>';try{let slots=await api('/api/slots?date='+d);$('times').innerHTML=slots.map(x=>`<button class="slot ${x.available?'':'off'} ${selectedTime===x.time?'sel':''}" ${x.available?`onclick="pickTime('${x.time}')"`:''}>${x.time}</button>`).join('')}catch(e){$('times').innerHTML='<div class="notice">Não foi possível carregar os horários.</div>'}}
function pickTime(t){selectedTime=t;steps(4);renderForm()}
function renderForm(){$('app').innerHTML=`<div class="card"><h2>Seus dados</h2><div class="summary"><b>${selectedService.name}</b><br>${selectedDate.split('-').reverse().join('/')} às ${selectedTime}<br><span class="yellow">R$ ${Number(selectedService.price).toFixed(2).replace('.',',')}</span></div><div class="form" style="margin-top:14px"><input class="input" id="name" placeholder="Nome completo"><input class="input" id="phone" placeholder="WhatsApp / telefone"><input class="input" id="vehicle" placeholder="Veículo (opcional)"><input class="input" id="notes" placeholder="Observação (opcional)"></div><button class="btn primary" onclick="book()">Confirmar agendamento</button><button class="btn secondary" onclick="pickDate(selectedDate)">Voltar</button></div>`}
async function book(){let body={service_id:selectedService.id,date:selectedDate,time:selectedTime,customer_name:$('name').value.trim(),phone:$('phone').value.trim(),vehicle:$('vehicle').value.trim(),notes:$('notes').value.trim()};if(!body.customer_name||!body.phone)return alert('Preencha nome e WhatsApp.');try{let a=await api('/api/appointments',{method:'POST',body:JSON.stringify(body)});$('app').innerHTML=`<div class="card ok"><h2>Agendamento recebido!</h2><div style="font-size:42px">✓</div><p>Seu horário foi registrado no sistema da FarolTech.</p><div class="summary"><b>${body.customer_name}</b><br>${selectedService.name}<br>${selectedDate.split('-').reverse().join('/')} às ${selectedTime}</div><button class="btn primary" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Olá! Meu agendamento FarolTech foi feito para '+selectedDate.split('-').reverse().join('/')+' às '+selectedTime+'.'),'_blank')">Enviar pelo WhatsApp</button></div>`}catch(e){alert(e.message);pickDate(selectedDate)}}
async function showMine(){let p=prompt('Digite o WhatsApp usado no agendamento:');if(!p)return;try{let arr=await api('/api/my-appointments?phone='+encodeURIComponent(p));$('app').innerHTML='<div class="card"><h2>Meus agendamentos</h2>'+(arr.length?arr.map(a=>`<div class="card"><b>${a.service_name||a.service}</b><br>${a.date.split('-').reverse().join('/')} às ${a.time}<br>Status: ${a.status}</div>`).join(''):'<p class="muted">Nenhum agendamento encontrado.</p>')+'<button class="btn secondary" onclick="start()">Voltar</button></div>'}catch(e){alert(e.message)}}
start();
</script></body></html>
